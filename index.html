<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperReading - 论文阅读笔记</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }

  /* Header */
  header { text-align: center; margin-bottom: 2.5rem; }
  header h1 {
    font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--accent), #bc8cff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { color: var(--text-muted); font-size: 1.05rem; max-width: 620px; margin: 0 auto; }

  /* Stats */
  .stats { display: flex; justify-content: center; gap: 1.2rem; margin: 1.5rem 0 2.5rem; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.8rem 1.5rem; text-align: center; min-width: 110px;
  }
  .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }

  /* Search */
  .search-box { display: flex; justify-content: center; margin-bottom: 2.5rem; }
  .search-box input {
    width: 100%; max-width: 480px; padding: 0.7rem 1rem;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-muted); }

  /* Category */
  .category { margin-bottom: 2.5rem; }
  .category-header {
    display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 1rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .category-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }
  .category-header h2 { font-size: 1.2rem; font-weight: 600; }
  .category-header .badge {
    font-size: 0.75rem; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 0.1rem 0.6rem; margin-left: auto;
  }
  .category-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }

  /* Icon themes */
  .icon-vlm  { background: #1f6feb22; color: #58a6ff; }
  .icon-wam  { background: #23883522; color: #3fb950; }
  .icon-vla  { background: #9e6a0322; color: #d29922; }
  .icon-agi  { background: #db6d2822; color: #db6d28; }
  .icon-radar { background: #2ea04322; color: #56d364; }
  .icon-other { background: #8957e522; color: #bc8cff; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.85rem;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.1rem 1.3rem;
    text-decoration: none; color: var(--text);
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 4px 20px #0004;
  }
  .card .title { font-size: 1rem; font-weight: 600; color: var(--accent); }
  .card .desc  { font-size: 0.82rem; color: var(--text-muted); }

  /* Footer */
  footer {
    text-align: center; margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .hidden { display: none !important; }
</style>
</head>

  <div class="search-box">

  </div>

  <div id="content"></div>

</div>

const contentEl = document.getElementById("content");
const totalEl = document.getElementById("total");
let totalCount = 0;

categories.forEach(cat => {
  totalCount += cat.papers.length;
  const section = document.createElement("div");
  section.className = "category";
  section.id = cat.id;

  section.innerHTML = `
    <div class="category-header">
      <div class="category-icon ${cat.icon}">${cat.emoji}</div>
      <h2>${cat.name}</h2>
      <span class="badge">${cat.papers.length} 篇</span>
    </div>
    <p class="category-desc">${cat.desc}</p>
    <div class="grid">
      ${cat.papers.map(p => `
        <a class="card" href="${p.file}" data-search="${(p.title + ' ' + p.desc).toLowerCase()}">
          <span class="title">${p.title}</span>
          <span class="desc">${p.desc}</span>
        </a>
      `).join("")}
    </div>
  `;
  contentEl.appendChild(section);
});
totalEl.textContent = totalCount;

document.getElementById("search").addEventListener("input", function () {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll(".category").forEach(section => {
    let visibleCount = 0;
    section.querySelectorAll(".card").forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle("hidden", !match);
      if (match) visibleCount++;
    });
    section.classList.toggle("hidden", visibleCount === 0);
  });
});
