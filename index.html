<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperReading - 论文阅读笔记</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --tag-bg: #1f6feb22;
    --tag-text: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
  header { text-align: center; margin-bottom: 3rem; }
  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--accent), #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto; }
  .stats {
    display: flex; justify-content: center; gap: 2rem;
    margin: 1.5rem 0 2.5rem; flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.8rem;
    text-align: center;
    min-width: 130px;
  }
  .stat .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
  .search-box {
    display: flex; justify-content: center; margin-bottom: 2rem;
  }
  .search-box input {
    width: 100%; max-width: 480px;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.3rem 1.4rem;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px #0004;
  }
  .card .title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
  }
  .card .desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    flex: 1;
  }
  .card .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 0.75rem;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    align-self: flex-start;
  }
  footer {
    text-align: center;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📖 PaperReading</h1>
    <p>把研究论文读成"可长期保存的思想笔记" — 结构化 HTML 阅读笔记合集</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="count">0</div><div class="label">篇笔记</div></div>
    <div class="stat"><div class="num">🧠</div><div class="label">深度解读</div></div>
    <div class="stat"><div class="num">📊</div><div class="label">SVG 可视化</div></div>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 搜索论文笔记..." autocomplete="off">
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <p>Powered by <a href="https://github.com" target="_blank">GitHub Pages</a> · Generated by PaperReading Skill</p>
  </footer>
</div>

<script>
const papers = [
  { file: "examples/Cola-DLM.html", title: "Cola-DLM", desc: "Cola-DLM 论文阅读笔记", tag: "Language Model" },
  { file: "examples/Cosmos.html", title: "Cosmos", desc: "Cosmos 论文阅读笔记", tag: "World Model" },
  { file: "examples/Cosmos3.html", title: "Cosmos3", desc: "Cosmos3 论文阅读笔记", tag: "World Model" },
  { file: "examples/InternVL.html", title: "InternVL", desc: "InternVL 论文阅读笔记", tag: "Multimodal" },
  { file: "examples/JEPA.html", title: "JEPA", desc: "JEPA 论文阅读笔记", tag: "Self-Supervised" },
  { file: "examples/LLaDA2-Uni.html", title: "LLaDA2-Uni", desc: "LLaDA2-Uni 论文阅读笔记", tag: "Language Model" },
  { file: "examples/LLaVA.html", title: "LLaVA", desc: "LLaVA 论文阅读笔记", tag: "Multimodal" },
  { file: "examples/OCR.html", title: "OCR", desc: "OCR 论文阅读笔记", tag: "Vision" },
  { file: "examples/QwenVL-series.html", title: "QwenVL Series", desc: "QwenVL 系列论文阅读笔记", tag: "Multimodal" },
  { file: "examples/RL.html", title: "RL", desc: "强化学习论文阅读笔记", tag: "Reinforcement Learning" },
  { file: "examples/WAM.html", title: "WAM", desc: "WAM 论文阅读笔记", tag: "World Model" },
  { file: "examples/pi-series-evolution.html", title: "Pi Series Evolution", desc: "Pi 系列演化论文阅读笔记", tag: "Language Model" },
  { file: "examples/vla-four-policies-code.html", title: "VLA Four Policies (Code)", desc: "VLA 四策略代码版论文阅读笔记", tag: "VLA" },
  { file: "examples/vla-four-policies.html", title: "VLA Four Policies", desc: "VLA 四策略论文阅读笔记", tag: "VLA" },
  { file: "examples/world-model-vla-synthesis.html", title: "World Model × VLA Synthesis", desc: "世界模型与 VLA 综合论文阅读笔记", tag: "World Model" },
];

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
countEl.textContent = papers.length;

papers.forEach(p => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = p.file;
  a.setAttribute("data-title", p.title.toLowerCase());
  a.setAttribute("data-desc", p.desc.toLowerCase());
  a.setAttribute("data-tag", p.tag.toLowerCase());
  a.innerHTML = `<span class="tag">${p.tag}</span><span class="title">${p.title}</span><span class="desc">${p.desc}</span>`;
  grid.appendChild(a);
});

document.getElementById("search").addEventListener("input", function () {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(card => {
    const match = card.dataset.title.includes(q) || card.dataset.desc.includes(q) || card.dataset.tag.includes(q);
    card.classList.toggle("hidden", !match);
  });
});
</script>
</body>
</html>
