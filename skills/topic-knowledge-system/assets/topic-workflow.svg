<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 1270" width="1880" height="1270" role="img" aria-labelledby="title description">
<title id="title">专题知识体系 · 证据驱动的迭代流程</title>
<desc id="description">已有材料和检索候选经过轻量筛选、单篇证据核验、跨篇综合和交付。附录与图表按需读取，缺口反馈检索，支持增量更新。</desc>
<style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Droid Sans Fallback",sans-serif}</style>
<rect x="0" y="0" width="1880" height="1270" rx="0" fill="#faf9f3" stroke="none" stroke-width="1.3"/>
<text x="45" y="42" font-size="16" fill="#497160" font-weight="700" text-anchor="start" letter-spacing="1.8">TOPIC KNOWLEDGE SYSTEM / EVIDENCE LOOP</text>
<text x="45" y="100" font-size="45" fill="#263b32" font-weight="700" text-anchor="start" letter-spacing="0">专题知识体系 · 证据驱动的迭代流程</text>
<text x="45" y="140" font-size="22" fill="#566f62" font-weight="400" text-anchor="start" letter-spacing="0">人工资料与检索候选共同进入；保存研究记录，按问题综合，按证据更新。</text>
<text x="1830" y="50" font-size="20" fill="#496e5c" font-weight="700" text-anchor="end" letter-spacing="0">六个环节 · 会话与工具协作</text>
<rect x="45" y="195" width="255" height="120" rx="14" fill="#e5efe7" stroke="none" stroke-width="1.3"/>
<text x="65" y="232" font-size="24" fill="#3c735e" font-weight="700" text-anchor="start" letter-spacing="0">01  范围与输入</text>
<text x="65" y="268" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">先确定研究问题</text>
<text x="335" y="226" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">已有资料</text>
<text x="335" y="261" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">人工选篇、PDF、论文库</text>
<text x="335" y="286" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">结构化证据与旧串讲</text>
<path d="M660 225 V307" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="226" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">问题与读者</text>
<text x="685" y="261" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">问题树先作假设</text>
<text x="685" y="286" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">允许证据推动分类调整</text>
<path d="M1010 225 V307" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="226" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">来源与预算</text>
<text x="1035" y="261" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">本地 / 允许外部检索</text>
<text x="1035" y="286" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">截至日期、轮次和查询预算</text>
<path d="M1360 225 V307" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="226" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">研究记录</text>
<text x="1385" y="261" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">固定论文版本与身份</text>
<text x="1385" y="286" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">候选、证据、关系分别保存</text>
<path d="M335 327 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-3c735e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c735e"/></marker></defs>
<path d="M170 315 V357" fill="none" stroke="#3c735e" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-3c735e)"/>
<rect x="45" y="357" width="255" height="120" rx="14" fill="#f4e8de" stroke="none" stroke-width="1.3"/>
<text x="65" y="394" font-size="24" fill="#946749" font-weight="700" text-anchor="start" letter-spacing="0">02  发现候选</text>
<text x="65" y="430" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">围绕具体缺口查找</text>
<text x="335" y="388" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">先复用资料</text>
<text x="335" y="423" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">补经典、竞争路线与反例</text>
<text x="335" y="448" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">不反复检索已知结果</text>
<path d="M660 387 V469" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="388" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">GPT Researcher</text>
<text x="685" y="423" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">按缺口规划与发出查询</text>
<text x="685" y="448" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">保留实际查询、来源和时间</text>
<path d="M1010 387 V469" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="388" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">引文与外部核查</text>
<text x="1035" y="423" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">沿前作 / 后续工作补证</text>
<text x="1035" y="448" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">资源访问与执行分别记录</text>
<path d="M1360 387 V469" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="388" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">停止条件</text>
<text x="1385" y="423" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">预算、重复查询、有效增量</text>
<text x="1385" y="448" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">停止仍保留未解决问题</text>
<path d="M335 489 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-946749" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#946749"/></marker></defs>
<path d="M170 477 V519" fill="none" stroke="#946749" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-946749)"/>
<rect x="45" y="519" width="255" height="120" rx="14" fill="#e7eef7" stroke="none" stroke-width="1.3"/>
<text x="65" y="556" font-size="24" fill="#4a7097" font-weight="700" text-anchor="start" letter-spacing="0">03  筛选论文</text>
<text x="65" y="592" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">低成本处理候选</text>
<text x="335" y="550" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">身份与版本</text>
<text x="335" y="585" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">DOI / arXiv 去重</text>
<text x="335" y="610" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">题名匹配疑点单独待核</text>
<path d="M660 549 V631" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="550" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">调用 screen</text>
<text x="685" y="585" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">原摘要、元数据与选定页</text>
<text x="685" y="610" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">必要时探查引言和方法</text>
<path d="M1010 549 V631" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="550" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">相关性与增量</text>
<text x="1035" y="585" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">问题匹配、分支与新增内容</text>
<text x="1035" y="610" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">证据不足不等于不相关</text>
<path d="M1360 549 V631" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="550" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">候选状态</text>
<text x="1385" y="585" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">纳入 / 待核 / 排除及理由</text>
<text x="1385" y="610" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">人工必读标记仍保留</text>
<path d="M335 651 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-4a7097" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7097"/></marker></defs>
<path d="M170 639 V681" fill="none" stroke="#4a7097" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4a7097)"/>
<rect x="45" y="681" width="255" height="120" rx="14" fill="#efe8f4" stroke="none" stroke-width="1.3"/>
<text x="65" y="718" font-size="24" fill="#80658e" font-weight="700" text-anchor="start" letter-spacing="0">04  单篇取证</text>
<text x="65" y="754" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">复用论文理解 Agent</text>
<text x="335" y="712" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">调用 evidence</text>
<text x="335" y="747" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">固定版本的页、章、篇理解</text>
<text x="335" y="772" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">有同版产物时增量补齐</text>
<path d="M660 711 V793" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="712" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">附录 / 图表按需</text>
<text x="685" y="747" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">证明、设置、消融、主结果</text>
<text x="685" y="772" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">工具 + 会话视觉核验</text>
<path d="M1010 711 V793" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="712" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">事实支持核验</text>
<text x="1035" y="747" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">来源、数字、归因与条件</text>
<text x="1035" y="772" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">错误局部修复，缺口待核</text>
<path d="M1360 711 V793" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="712" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">统一证据包</text>
<text x="1385" y="747" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">fact → evidence → 原文单元</text>
<text x="1385" y="772" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">已读范围、原图与核验指纹</text>
<path d="M335 813 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-80658e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#80658e"/></marker></defs>
<path d="M170 801 V843" fill="none" stroke="#80658e" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-80658e)"/>
<rect x="45" y="843" width="255" height="120" rx="14" fill="#f2eddc" stroke="none" stroke-width="1.3"/>
<text x="65" y="880" font-size="24" fill="#937b38" font-weight="700" text-anchor="start" letter-spacing="0">05  跨篇综合</text>
<text x="65" y="916" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">按问题解释方法差异</text>
<text x="335" y="874" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">问题与符号对齐</text>
<text x="335" y="909" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">假设、输入输出和约束</text>
<text x="335" y="934" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">同一论文可服务多个问题</text>
<path d="M660 873 V955" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="874" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">分支教学算例</text>
<text x="685" y="909" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">复用旧串讲的有效讲解</text>
<text x="685" y="934" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">绑定公式 / 算法 / 原图</text>
<path d="M1010 873 V955" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="874" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">条件与关系</text>
<text x="1035" y="909" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">可比结果、反例和适用边界</text>
<text x="1035" y="934" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">继承 / 互补 / 不同约束</text>
<path d="M1360 873 V955" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="874" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">结论与缺口</text>
<text x="1385" y="909" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">跨篇结论关联支持事实</text>
<text x="1385" y="934" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">未知条件保留为未知</text>
<path d="M335 975 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-937b38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#937b38"/></marker></defs>
<path d="M170 963 V1005" fill="none" stroke="#937b38" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-937b38)"/>
<rect x="45" y="1005" width="255" height="120" rx="14" fill="#e7efdf" stroke="none" stroke-width="1.3"/>
<text x="65" y="1042" font-size="24" fill="#63834d" font-weight="700" text-anchor="start" letter-spacing="0">06  生成交付</text>
<text x="65" y="1078" font-size="18" fill="#5c6d62" font-weight="400" text-anchor="start" letter-spacing="0">研究记录驱动展示</text>
<text x="335" y="1036" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">字段绑定与核验</text>
<text x="335" y="1071" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">topic.json 绑定已审结论</text>
<text x="335" y="1096" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">待核内容不混入确定结论</text>
<path d="M660 1035 V1117" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="685" y="1036" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">SVG 与离线 HTML</text>
<text x="685" y="1071" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">问题树、章内树、公式与原图</text>
<text x="685" y="1096" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">展示容量不限制研究记录</text>
<path d="M1010 1035 V1117" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="1036" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">交付检查</text>
<text x="1035" y="1071" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">页码、链接、原图、手机阅读</text>
<text x="1035" y="1096" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">区分自动检查与语义复核</text>
<path d="M1360 1035 V1117" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="1036" font-size="23" fill="#2c4036" font-weight="700" text-anchor="start" letter-spacing="0">增量更新</text>
<text x="1385" y="1071" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">保留旧版与实际覆盖范围</text>
<text x="1385" y="1096" font-size="19" fill="#5b7064" font-weight="400" text-anchor="start" letter-spacing="0">事实变化使旧核验失效</text>
<path d="M335 1137 H1730" fill="none" stroke="#d8dfd4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
<defs><marker id="arrow-8b6c98" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b6c98"/></marker></defs>
<path d="M1735 746 H1780 V420 H1735" fill="none" stroke="#8b6c98" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow-8b6c98)"/>
<defs><marker id="arrow-a38a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a38a40"/></marker></defs>
<path d="M1735 908 H1820 V405 H1735" fill="none" stroke="#a38a40" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow-a38a40)"/>
<text x="1769" y="710" transform="rotate(-90 1769 710)" font-size="17" fill="#7d608d">缺少原文 / 引文证据</text>
<text x="1809" y="865" transform="rotate(-90 1809 865)" font-size="17" fill="#8f772e">发现基线、反例或知识盲区</text>
<rect x="45" y="1190" width="1685" height="48" rx="10" fill="#eaf0e5" stroke="none" stroke-width="1.3"/>
<text x="65" y="1221" font-size="20" fill="#425c4d" font-weight="400" text-anchor="start" letter-spacing="0">论文理解负责单篇取证；专题负责取舍与跨篇综合；PaperStudio 保留单篇、串讲和雷达，并复用同一证据。</text>
</svg>
