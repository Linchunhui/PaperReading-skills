<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1097" width="1560" height="1097" role="img" aria-labelledby="title description">
<title id="title">论文理解 Agent · 调度编排</title>
<desc id="description">PyMuPDF 将原始 PDF 转成带定位的文本和按需页面图。Agent 运行页、章、篇主链，另行抽取元数据及参考文献，随后评估、生成阅读稿和合并。</desc>
<style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Droid Sans Fallback",sans-serif}</style>
<rect x="0" y="0" width="1560" height="1097" rx="0" fill="#f5f8fa" stroke="none" stroke-width="1.3"/>
