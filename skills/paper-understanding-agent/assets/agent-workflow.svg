<text x="647" y="611" font-size="25" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="0">章节 · 局部机制与论证</text>
<text x="647" y="643" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">独立章节约束与输出结构</text>
<text x="647" y="668" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">解释假设、推导、实验及缺口</text>
<rect x="1200" y="575" width="450" height="130" rx="12" fill="#e5edfc" stroke="#4d81ce" stroke-width="1.3"/>
<text x="1222" y="611" font-size="25" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="0">篇级 · 跨章综合</text>
<text x="1222" y="643" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">贯通问题、方法、证据与边界</text>
<text x="1222" y="668" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">回读已声明原文，检查摘要遗漏</text>
