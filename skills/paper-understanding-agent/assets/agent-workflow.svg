<text x="72" y="1208" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">自动校验 + 会话语义复核；问题按源解析、视觉、抽取或比较分别处理。预算耗尽保留待核。</text>
