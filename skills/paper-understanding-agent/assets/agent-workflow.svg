<text x="72" y="1018" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">先复用领域基线，再定向检索</text>
<text x="72" y="1043" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">区分前作、评审、资源核查与执行</text>
