<title id="title">论文理解 Agent · 分层理解与按需取证</title>
<desc id="description">三种任务入口。正文分层理解，附录和图表按需核验，深读与评估并行，记录证据状态并局部修复。</desc>
<style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Droid Sans Fallback",sans-serif}</style>
<rect x="0" y="0" width="1720" height="1450" rx="0" fill="#f7f9fc" stroke="none" stroke-width="1.3"/>
<text x="50" y="43" font-size="16" fill="#007d9c" font-weight="700" text-anchor="start" letter-spacing="1.8">PAPER UNDERSTANDING / EVIDENCE WORKFLOW</text>
<text x="50" y="98" font-size="43" fill="#142537" font-weight="700" text-anchor="start" letter-spacing="0">论文理解 Agent · 分层理解与按需取证</text>
<text x="50" y="135" font-size="22" fill="#51657a" font-weight="400" text-anchor="start" letter-spacing="0">保留完整解读，按任务深度读取；每项结论都能回到固定版本的原文。</text>
<rect x="50" y="170" width="500" height="110" rx="12" fill="#e0f2f7" stroke="#188daa" stroke-width="1.3"/>
<text x="72" y="206" font-size="25" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="0">固定版本的 PDF / 已有记录</text>
<text x="72" y="238" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">论文 ID、版本、文件哈希</text>
<text x="72" y="263" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">复用文本块、页码、坐标与原图</text>
<rect x="600" y="170" width="500" height="110" rx="12" fill="#e8f1e9" stroke="#4e8d70" stroke-width="1.3"/>
<text x="622" y="206" font-size="25" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="0">正文 · 附录 · 图表索引</text>
<text x="622" y="238" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">核对读序、章节与作者原摘要</text>
<text x="622" y="263" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">索引和未读状态保留在范围记录中</text>
<rect x="1150" y="170" width="500" height="110" rx="12" fill="#f6eddf" stroke="#b38c4a" stroke-width="1.3"/>
<text x="1172" y="206" font-size="25" fill="#172b3a" font-weight="700" text-anchor="start" letter-spacing="0">来源与交付边界</text>
<text x="1172" y="238" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">本地 / 允许外部检索；读取预算</text>
<text x="1172" y="263" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">同版事实复用，核验记录绑定指纹</text>
