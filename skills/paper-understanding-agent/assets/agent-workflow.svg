<text x="241.0" y="206" font-size="15" fill="#077d99" font-weight="700" text-anchor="middle" letter-spacing="0">PyMuPDF · 可选入口</text>
<text x="241.0" y="233" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">文本块、页码、坐标与按需页面图</text>
