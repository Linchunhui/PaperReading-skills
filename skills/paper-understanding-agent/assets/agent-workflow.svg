<rect width="1560" height="1097" fill="url(#grid)"/>
<text x="42" y="39" font-size="15" fill="#077d99" font-weight="700" text-anchor="start" letter-spacing="1.8">PAPER UNDERSTANDING / AGENT ARCHITECTURE</text>
<text x="42" y="91" font-size="43" fill="#1d3043" font-weight="700" text-anchor="start" letter-spacing="0">论文理解 Agent 的调度编排</text>
<text x="42" y="125" font-size="19" fill="#506579" font-weight="400" text-anchor="start" letter-spacing="0">按页抽取证据，按章解释局部，再回到原文贯通整篇。</text>
