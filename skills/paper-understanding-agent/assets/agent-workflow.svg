<text x="1172" y="848" font-size="19" fill="#41576a" font-weight="400" text-anchor="start" letter-spacing="0">已核转写入库；视觉解释另存</text>
<defs><marker id="arrow-3295a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3295a0"/></marker></defs>
