name: Verify independent topic publication
on:
  push:
    branches: [codex/flat-topic-html-20261106]
    paths: ['.github/workflows/flat-topic-migration.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare every live HTML with the published Git blob
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,urllib.request,time
          expected=json.loads("[{\"path\":\"examples/Topics/agent-general-topic.html\",\"sha\":\"71abca7f046ccb97a34424cc6b5d7f337dfdcda7\"},{\"path\":\"examples/Topics/agent-tasks-topic.html\",\"sha\":\"4d330081643ec1ca76b06c41bbc1019ec921d30a\"},{\"path\":\"examples/Topics/architecture-main-topic.html\",\"sha\":\"e826059b5cc4f25d3e140352ac054370b22d9694\"},{\"path\":\"examples/Topics/diffusion-main-topic.html\",\"sha\":\"1e98f2f95bf442cf91deee2e5d7cdff5c7a062dd\"},{\"path\":\"examples/Topics/document-parsing-topic.html\",\"sha\":\"8f21d1423013b28faaddfdd58a8e8154cbe0e2d4\"},{\"path\":\"examples/Topics/embodied-interaction-topic.html\",\"sha\":\"019e065c06c2854fefd18572e8239c94789be3e8\"},{\"path\":\"examples/Topics/embodied-vla-topic.html\",\"sha\":\"5a2b4261c8dc2ce0bfdf8ae661e68e7a5086cc04\"},{\"path\":\"examples/Topics/harness-system-topic.html\",\"sha\":\"24dcb61022fe2a5b11f2e5c0995b5925d3ce9c01\"},{\"path\":\"examples/Topics/image-acceleration-topic.html\",\"sha\":\"c465526449fc84cadd6aedd77295fc4efd6becf0\"},{\"path\":\"examples/Topics/image-control-edit-topic.html\",\"sha\":\"c6de9b1eccd56f8209deb6209c53b77778ab5541\"},{\"path\":\"examples/Topics/image-design-topic.html\",\"sha\":\"911ef975a4de99b801633feccf2380412b5a55b9\"},{\"path\":\"examples/Topics/image-foundation-topic.html\",\"sha\":\"e61bc648cb9ba8118d49f027cfb41f70afbb3e46\"},{\"path\":\"examples/Topics/inference-main-topic.html\",\"sha\":\"380705cb30c46384825ced7a012d1dbfc0581a65\"},{\"path\":\"examples/Topics/multimodal-context-topic.html\",\"sha\":\"5565d1212dca5dd55121fa40b71f65b0eed6a905\"},{\"path\":\"examples/Topics/multimodal-core-topic.html\",\"sha\":\"a2ae962491be7b23b999989ded8c14d5c119ec68\"},{\"path\":\"examples/Topics/opd-main-topic.html\",\"sha\":\"f5d303038942bf73871b380bca9342a57b59ead9\"},{\"path\":\"examples/Topics/research-system-topic.html\",\"sha\":\"4456867a9b5cade4e836b174b954dcfb83457fec\"},{\"path\":\"examples/Topics/rl-main-topic.html\",\"sha\":\"85b5753286b51bb0554a64e0753a28993f346d84\"},{\"path\":\"examples/Topics/unified-model-topic.html\",\"sha\":\"c138872dbf34a9266ce59dbf1dffb4465b5a1ec8\"},{\"path\":\"examples/Topics/video-control-edit-topic.html\",\"sha\":\"304db281a0e2b6a0669239cc5b31ada0643ac756\"},{\"path\":\"examples/Topics/video-model-topic.html\",\"sha\":\"44ab0ab50fd6383daa3ba18404e6f513162d49bb\"},{\"path\":\"examples/Topics/world-main-topic.html\",\"sha\":\"6a3ea220d7db32703c1efd63df15e92ea026454f\"},{\"path\":\"index.html\",\"sha\":\"460441c73ba0dd5b63cb59ecc36cea75f52b700f\"}]")
          base='https://linchunhui.github.io/PaperReading-skills/'
          def check(item):
           url=base+item['path']
           request=urllib.request.Request(url,headers={'User-Agent':'Topic-publication-check/1.0','Accept-Encoding':'identity'})
           with urllib.request.urlopen(request,timeout=60) as response:
            data=response.read();status=response.status
           sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           assert status==200 and sha==item['sha'],(item['path'],status,sha,item['sha'])
           return {'path':item['path'],'http':status,'bytes':len(data),'matches_published_git_blob':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
           results=list(pool.map(check,expected))
          print(json.dumps({'ok':True,'checked_urls':len(results),'commit':'f8ea5d07c78ba0038beef5d4328527d7e7769ecb','results':results}))
          PY
