<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title description">
<title id="title">PaperStudio · 论文解读选路</title>
<desc id="description">按输入选择单篇精读、同方向串讲或雷达发现。三个模式共用八项论文主线，交付 HTML 和可选公众号 Markdown。</desc>
<style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Droid Sans Fallback",sans-serif}</style>
<rect x="0" y="0" width="1200" height="420" rx="0" fill="#fbf9f2" stroke="none" stroke-width="1.3"/>
<text x="32" y="37" font-size="14" fill="#285b4e" font-weight="700" text-anchor="start" letter-spacing="1.7">PAPERSTUDIO / READING MODES</text>
<text x="32" y="84" font-size="38" fill="#1d332d" font-weight="700" text-anchor="start" letter-spacing="0">PaperStudio · 论文解读选路</text>
<text x="32" y="116" font-size="18" fill="#4a6156" font-weight="400" text-anchor="start" letter-spacing="0">按输入和目标选入口，每篇保留一条能独立读懂的论文主线。</text>
<rect x="32" y="146" width="366" height="136" rx="12" fill="#e5efe7" stroke="#2d6b57" stroke-width="1.3"/>
<text x="215.0" y="177" font-size="22" fill="#1d3043" font-weight="700" text-anchor="middle" letter-spacing="0">单篇精读</text>
<text x="215.0" y="202" font-size="15" fill="#2d6b57" font-weight="700" text-anchor="middle" letter-spacing="0">single</text>
<text x="215.0" y="229" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">输入：一篇论文</text>
<text x="215.0" y="254" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">讲透机制、公式和实验证据</text>
<defs><marker id="arrow-2d6b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6b57"/></marker></defs>
<path d="M215 282 V302" fill="none" stroke="#2d6b57" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2d6b57)"/>
<rect x="417" y="146" width="366" height="136" rx="12" fill="#e8eff7" stroke="#3c6388" stroke-width="1.3"/>
<text x="600.0" y="177" font-size="22" fill="#1d3043" font-weight="700" text-anchor="middle" letter-spacing="0">同方向串讲</text>
<text x="600.0" y="202" font-size="15" fill="#3c6388" font-weight="700" text-anchor="middle" letter-spacing="0">series</text>
<text x="600.0" y="229" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">输入：同问题的多篇论文</text>
<text x="600.0" y="254" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">比较各路线的改动和适用条件</text>
<defs><marker id="arrow-3c6388" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c6388"/></marker></defs>
<path d="M600 282 V302" fill="none" stroke="#3c6388" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-3c6388)"/>
<rect x="802" y="146" width="366" height="136" rx="12" fill="#f3e9df" stroke="#875137" stroke-width="1.3"/>
<text x="985.0" y="177" font-size="22" fill="#1d3043" font-weight="700" text-anchor="middle" letter-spacing="0">雷达发现</text>
<text x="985.0" y="202" font-size="15" fill="#875137" font-weight="700" text-anchor="middle" letter-spacing="0">radar</text>
<text x="985.0" y="229" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">输入：方向与时间，或候选清单</text>
<text x="985.0" y="254" font-size="16" fill="#3e566c" font-weight="400" text-anchor="middle" letter-spacing="0">梳理研究动态并逐篇讲清主线</text>
<defs><marker id="arrow-875137" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#875137"/></marker></defs>
<path d="M985 282 V302" fill="none" stroke="#875137" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-875137)"/>
<rect x="32" y="305" width="1136" height="70" rx="12" fill="#f1efe4" stroke="#c4cbbb" stroke-width="1.3"/>
<text x="51" y="332" font-size="18" fill="#285b4e" font-weight="700" text-anchor="start" letter-spacing="0">每篇解读</text>
<text x="51" y="355" font-size="18" fill="#293d34" font-weight="400" text-anchor="start" letter-spacing="0">背景 → 方向 → 问题 → 思路 → 方法 → 主结果 → 消融或分析 → 带条件总结</text>
<text x="32" y="401" font-size="16" fill="#4a6156" font-weight="400" text-anchor="start" letter-spacing="0">默认交付 HTML 与公众号 Markdown。可指定只输出 HTML 或只在对话中讲解。</text>
</svg>
